groups:
  - name: laravel
    rules:
      - alert: HighErrorRate
        expr: >
          sum(rate(app_http_requests_total{status=~"5.."}[2m]))
          / sum(rate(app_http_requests_total[2m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Error rate above 5%"
          description: "{{ $value | humanizePercentage }} of requests are returning 5xx over the last 2 minutes."

      - alert: SlowP95Latency
        expr: >
          histogram_quantile(0.95,
            sum(rate(app_http_request_duration_seconds_bucket[2m])) by (le)
          ) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 500ms"
          description: "p95 response time is {{ $value | humanizeDuration }} over the last 2 minutes."
